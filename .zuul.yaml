---

- job:
    name: oslo.messaging-tox-py311-func-scenario01
    parent: openstack-tox-py311
    vars:
      tox_envlist: py311-func-scenario01
      bindep_profile: rabbit

- job:
    name: oslo.messaging-tox-py311-func-scenario02
    parent: openstack-tox-py311
    vars:
      tox_envlist: py311-func-scenario02
      bindep_profile: rabbit kafka

# Begin v3 native jobs
# See https://docs.openstack.org/devstack/latest/

- job:
    name: oslo.messaging-devstack-tempest-full-base
    description: |
      Base for all devstack based tempest full testing jobs (with
      neutron)
    abstract: true
    parent: devstack-tempest
    timeout: 10800
    required-projects:
      - openstack/oslo.messaging
    vars:
      tox_envlist: full

- job:
    name: oslo.messaging-src-dsvm-full-rabbit
    description: |
      Run full tempest tests against rabbitmq
    parent: oslo.messaging-devstack-tempest-full-base

- job:
    name: oslo.messaging-src-dsvm-full-kafka-hybrid
    description: |
      Run the full tempest tests using Apache Kafka for Notifications.
    parent: oslo.messaging-devstack-tempest-full-base
    required-projects:
      - openstack/devstack-plugin-kafka
    vars:
      devstack_plugins:
        devstack-plugin-kafka: https://opendev.org/openstack/devstack-plugin-kafka
      zuul_copy_output:
        '{{ devstack_log_dir }}/server.log': logs

- job:
    name: oslo.messaging-grenade
    parent: grenade
    timeout: 10800
    required-projects:
      - openstack/oslo.messaging
    irrelevant-files:
      - ^.*\.rst$
      - ^doc/.*$
      - ^releasenotes/.*$
      - ^.git.*$
      - ^(test-|)requirements.txt$
      - ^setup.cfg$
      - ^\.pre-commit-config\.yaml$

- job:
    name: oslo.messaging-grenade-multinode
    parent: grenade-multinode
    timeout: 10800
    required-projects:
      - openstack/oslo.messaging
    irrelevant-files:
      - ^.*\.rst$
      - ^doc/.*$
      - ^releasenotes/.*$
      - ^.git.*$
      - ^(test-|)requirements.txt$
      - ^setup.cfg$
      - ^\.pre-commit-config\.yaml$

- project:
    templates:
      - check-requirements
      - lib-forward-testing-python3
      - openstack-cover-jobs
      - openstack-python3-jobs
      - openstack-python3-next-jobs
      - periodic-stable-jobs
      - publish-openstack-docs-pti
      - release-notes-jobs-python3
    check:
      jobs:
        # TODO(tkajinam): remove this once we get python 3.15 wheel published
        # for confluent-kafka
        # https://github.com/confluentinc/confluent-kafka-python/issues/2299
        - openstack-tox-py315:
            voting: false
        - oslo.messaging-tox-py311-func-scenario01
        - oslo.messaging-tox-py311-func-scenario02:
            voting: false
        - oslo.messaging-src-dsvm-full-rabbit
        - oslo.messaging-src-dsvm-full-kafka-hybrid:
            voting: false
        - oslo.messaging-grenade:
            voting: false
        - oslo.messaging-grenade-multinode:
            voting: false
    gate:
      jobs:
        - openstack-tox-py315:
            voting: false
        - oslo.messaging-tox-py311-func-scenario01
        - oslo.messaging-src-dsvm-full-rabbit
